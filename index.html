<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Playground - Digital Portfolio</title>
    <meta name="description" content="Binary Playground - A collection of digital projects and web properties">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="hero">
            <h1 class="site-title">Binary Playground</h1>
            <p class="site-description">
                Digital ventures crafted by <a href="https://findingsimple.com" target="_blank" rel="noopener noreferrer">Jason Conroy</a>.
            </p>
        </header>

        <section class="portfolio" aria-label="Portfolio">
            <h2 class="visually-hidden">Portfolio Projects</h2>
            <ul class="portfolio-list">
                <li class="portfolio-item">
                    <a href="https://frags.au" class="portfolio-link" target="_blank" rel="noopener noreferrer">
                        <div class="portfolio-logo" aria-hidden="true">
                            <img src="assets/frags-logo.png" alt="Frags.au Logo">
                        </div>
                        <div class="portfolio-content">
                            <h3 class="portfolio-title">Frags.au</h3>
                            <p class="portfolio-tagline">Homegrown corals – Frag by Frag.</p>
                        </div>
                    </a>
                </li>
                <li class="portfolio-item">
                    <a href="https://brinybits.au" class="portfolio-link" target="_blank" rel="noopener noreferrer">
                        <div class="portfolio-logo" aria-hidden="true">
                            <img src="assets/brinybits-logo.png" alt="BrinyBits Logo">
                        </div>
                        <div class="portfolio-content">
                            <h3 class="portfolio-title">BrinyBits</h3>
                            <p class="portfolio-tagline">3D Printed and Acrylic Bits for Your Reef.</p>
                        </div>
                    </a>
                </li>
                <li class="portfolio-item">
                    <a href="https://jetty.works" class="portfolio-link" target="_blank" rel="noopener noreferrer">
                        <div class="portfolio-logo" aria-hidden="true">
                            <img src="assets/jettyworks-logo.png" alt="Jetty Works Logo">
                        </div>
                        <div class="portfolio-content">
                            <h3 class="portfolio-title">Jetty Works</h3>
                            <p class="portfolio-tagline">Manufactory by the sea.</p>
                        </div>
                    </a>
                </li>
            </ul>
        </section>

        <footer class="footer">
            <p>Made with ❤️ in South Australia 🇦🇺</p>
        </footer>
    </main>
</body>
</html>
